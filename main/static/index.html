<!doctype html>
<html lang="en">
  <head>

    <style>

  /* aspect-ratio: 296 / 128; */

  <body>
    <div id="app"></div>

    <script type="module">

// The quoto for localStorage is 5MiB per origin. We restrict to 4.5MB to
// have some leeway for other settings:
const MAX_DATAURL_SIZE = 4_500_000;

import { h, text, app } from "./hyperapp.js"

const objRetrieve = (obj, keys) => {
  return keys.reduce((value, key) => value[key], obj);
};

const objStore = (obj, keys, value) => {
  const key = keys.shift();
  return {
    ...obj,
    [key]: keys.length == 0 ? value : objStore(obj[key], keys, value),
  };
};

const updateRecursive = (a, b) => {
  for (const key in b) {
    if (typeof(a[key]) == "object" && !Array.isArray(a[key]) &&
        typeof(b[key]) == "object" && !Array.isArray(b[key]))
    {
      updateRecursive(a[key], b[key]);
    }
    else {
      a[key] = b[key];
    }
  }
  return a;
};

const JSON_safeParse = (text) => {
  try {
    return JSON.parse(text) || {};
  }
  catch (e) {
    return {};
  }
}


// Image operations

const transformColors = (pixelData, threshold) => {
  for (let i = 0; i < pixelData.length; i += 4) {
    const red   = pixelData[i + 0] >= threshold;
    const green = pixelData[i + 1] >= threshold;
    const blue  = pixelData[i + 2] >= threshold;

    const white = (red && green && blue);
    const color = (red || green || blue);

    pixelData[i + 0] = color ? 0xff : 0x00;
    pixelData[i + 1] = white ? 0xff : 0x00;
    pixelData[i + 2] = white ? 0xff : 0x00;
    pixelData[i + 3] = 0xff;
  }
  return pixelData;
};

const createImageBitmapFromDataURL = async function (dataURL) {
  const image = await new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = (e) => resolve(e.target);
    image.onerror = (e) => reject("Failed to load Image from DataURL");
    image.src = dataURL;
  });
  const bitmap = await window.createImageBitmap(image);
  return bitmap;
};

const renderImage = async function (image, width, height, renderSettings) {

  const {
    backgroundColor,
    colorThreshold,
    palette,
    imageRotation,
    dx,
    dy,
    sizeX,
    sizeY,
  } = renderSettings;

  const naturalWidth = image.width;
  const naturalHeight = image.height;

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d");
  context.fillStyle = backgroundColor;
  context.fillRect(0, 0, width, height);

  context.translate(width / 2, height / 2);
  context.rotate(imageRotation * Math.PI / 180);
  context.translate(-width / 2, -height / 2);
  context.drawImage(
    image,
    0, 0, naturalWidth, naturalHeight,
    dx, dy, sizeX, sizeY);
  context.resetTransform();

  const settings = { pixelFormat: "rgba-unorm8" };
  const imageData = context.getImageData(0, 0, width, height, settings);
  const pixelData = imageData.data;

  if (palette == "display") {
    transformColors(pixelData, colorThreshold);
    context.putImageData(imageData, 0, 0);
  }

  const imageURL = canvas.toDataURL();
  const imageBlob = new Blob([pixelData]);

  return {
    imageURL,
    imageBlob,
  };
};

const readAsDataURL = async function (file) {
  const bitmap = await window.createImageBitmap(file);

  let decimateFactor = 1;
  let dataURL = null;

  const MAX_WIDTH = 1280;
  const MAX_HEIGHT = 1280;

  while (bitmap.width / decimateFactor > MAX_WIDTH ||
         bitmap.height / decimateFactor > MAX_HEIGHT)
  {
    decimateFactor *= 2;
  }

  while (!dataURL || dataURL.length >= MAX_DATAURL_SIZE) {
    const canvas = document.createElement("canvas");
    canvas.width = bitmap.width / decimateFactor;
    canvas.height = bitmap.height / decimateFactor;

    const context = canvas.getContext("2d");
    context.drawImage(
      bitmap,
      0, 0, bitmap.width, bitmap.height,
      0, 0, canvas.width, canvas.height);
    dataURL = canvas.toDataURL();

    decimateFactor = decimateFactor * 2;
  }

  return dataURL;
};


// Local storage

const storageKey = 'NameTagOS';
const savedState = JSON.parse(localStorage.getItem(storageKey) || "{}");
const defaultSettings = {
  backgroundColor: "white",
  colorThreshold: 127,
  palette: "display",         // "original" | "display"

  aspectPreset: "picture",    // "picture" | "display" | "custom"
  aspectRatio: 1,             // width/height of displayed image
  zoom: 50,

  canvasRotation: "0deg",
  imageRotation: 0,

  // Offset of the image center from display center in multiples of the image size.
  // (0,0) means the center pixel of the selected image is displayed at
  // the center of the display. (0.5, 0.5) means the bottom right corner of the
  // image is displayed at the center of the display.
  // Why not simply take the absolute offset in display coordinates? Because
  // that would require recalculating xOffset/yOffset whenever the aspectRatio
  // or zoom is changed, which can lead to the image wandering offscreen due
  // to rounding errors or out-of-sequence calculations.
  xOffset: 0,
  yOffset: 0,
};
const initialState = {
  serverstatus: {
    wifiMode: "STA",
    wifiSsid: "NameTagNet",
    wifiHostname: "NameTagOS",
    wifiPassword: "",
    displayWidth: 296,
    displayHeight: 128,
  },
  // client
  activeTab: "status",
  isDragging: false,
  editstatus: {},
  sourceImageURL: null,
  sourceImageName: null,
  imageURL: null,
  imageBlob: null,
  imageBitmap: null,
  imageSettings: { ...defaultSettings },
  renderSettings: {},
};
updateRecursive(initialState, savedState);
updateRecursive(initialState, {
  disableInputs: true,
});

const storeLocal = (state) => {
  localStorage.setItem(storageKey, JSON.stringify({
    activeTab: state.activeTab,
    serverstatus: state.serverstatus,
    sourceImageURL: state.sourceImageURL?.length >= MAX_DATAURL_SIZE ? null : state.sourceImageURL,
    sourceImageName: state.sourceImageURL?.length >= MAX_DATAURL_SIZE ? null : state.sourceImageName,
    imageSettings: state.imageSettings,
  }));
  return UpdateUI(state);
};

const updateImage = (state, updateImageSettings={}) => {
  const image = state.sourceImageBitmap;
  if (!image) {
    return [storeLocal(state)];
  }

  const {displayWidth, displayHeight} = state.serverstatus;

  const oldSettings = state.imageSettings;
  const imageSettings = {...oldSettings, ...updateImageSettings};
  const {
    backgroundColor,
    aspectPreset,
    zoom,
    xOffset,
    yOffset,
    colorThreshold,
    palette,
    imageRotation,
  } = imageSettings;

  let zoomF = zoomFactor(zoom);
  let aspectRatio = imageSettings.aspectRatio;

  if (aspectPreset === "picture") {
    aspectRatio = image.width / image.height;
    imageSettings.aspectRatio = aspectRatio;
  }

  else if (aspectPreset === "display") {
    const getXYScaling = (imageRotation) => {
      const displayAspect = displayWidth / displayHeight;
      const offs = (displayAspect + 1) / 2;
      const ampl = (displayAspect - 1) / 2;
      const cos = Math.cos(2 * imageRotation * Math.PI / 180);

      const cx = offs + Math.abs(ampl) * cos;
      const cy = offs - Math.abs(ampl) * cos;
      return {cx, cy};
    };

    const aspectPresetChanged = oldSettings.aspectPreset !== aspectPreset;
    const imageRotationChanged = oldSettings.imageRotation !== imageRotation;
    const zoomChanged = oldSettings.zoom !== zoom;

    if (aspectPresetChanged || zoomChanged) {
      imageSettings.baseZoom = zoomF / getXYScaling(oldSettings.imageRotation).cy;
    }

    if (aspectPresetChanged || imageRotationChanged) {
      const {baseZoom} = imageSettings;
      const {cx, cy} = getXYScaling(imageRotation);

      aspectRatio = cx / cy;
      imageSettings.aspectRatio = aspectRatio;

      zoomF = baseZoom * cy;
      imageSettings.zoom = zoomValue(zoomF);
    }
  }

  const sizeX = displayHeight * zoomF * aspectRatio;
  const sizeY = displayHeight * zoomF;

  const dx = (displayWidth - sizeX) / 2 + xOffset * sizeX;
  const dy = (displayHeight - sizeY) / 2 + yOffset * sizeY;

  const renderSettings = {
    backgroundColor,
    colorThreshold,
    palette,
    imageRotation,
    dx,
    dy,
    sizeX,
    sizeY,
  };

  const newState = {
    ...state,
    imageSettings,
    renderSettings,
  };

  return [
    storeLocal(newState),
    [renderImageFromBitmap, newState],
  ];
};

const zoomFactor = (step) => Math.exp((step - 50) / 25);
const zoomValue = (factor) => Math.log(factor) * 25 + 50;
const aspectToFactor = (value) => Math.exp((value - 500) / 200);
const aspectToValue = (factor) => Math.log(factor) * 200 + 500;

// Effects

const fetchJson = (dispatch, [url, action]) => {
  fetch(url)
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const postRequest = (dispatch, [url, data, action]) => {
  fetch(url, {
    method: "POST",
    body: new URLSearchParams(data),
  })
  .then(response => response.json())
  .then(data => dispatch(action, data))
};

const uploadFile = (dispatch, [url, file, name, progressAction, finishAction]) => {
  const request = new XMLHttpRequest();
  request.open("POST", url);
  request.upload.onprogress = (event) => dispatch(progressAction, event);
  request.onreadystatechange = (event) => {
    if (request.readyState == 4) {
      dispatch(finishAction, event);
    }
  };
  const form = new FormData();
  form.append("file", file, name),
  request.send(form);
};

const readDataURLFromFile = (dispatch, [file]) => {
  readAsDataURL(file)
  .then(dataURL => dispatch(SetSourceImageURL, dataURL))
};

const renderImageFromFile = (dispatch, [file]) => {
  window.createImageBitmap(file)
  .then(bitmap => dispatch(SetSourceImageBitmap, bitmap))
};

const renderImageFromURL = (dispatch, [sourceImageURL, state]) => {
  createImageBitmapFromDataURL(sourceImageURL)
  .then(result => dispatch(SetSourceImageBitmap, result));
};

const renderImageFromBitmap = (dispatch, state) => {
  const {sourceImageBitmap, renderSettings} = state;
  const {displayWidth, displayHeight} = state.serverstatus;
  renderImage(sourceImageBitmap, displayWidth, displayHeight, renderSettings)
  .then(result => dispatch(SetImageData, result));
};

const timeout = (dispatch, [delay, action]) => {
  setTimeout(() => dispatch(action), delay);
};

const reloadWindow = (dispatch) => {
  window.location.reload();
};

const every = (dispatch, [delay, action]) => {
  const id = setInterval(() => { dispatch(action); }, delay);
  return () => clearInterval(id);
};


// Events

const DISABLE_TIMEOUT = 750;
const RELOAD_TIMEOUT = 10_000;

const GotServerStatus = (state, serverstatus) => {
  return [
    ...updateImage({
      ...state,
      serverstatus: {
        ...state.serverstatus,
        ...serverstatus,
      },
    }),
    [timeout, [DISABLE_TIMEOUT, EnableInputs]],
  ];
};


// Actions

const UpdateUI = (state) => {
  const editstatus = Object.fromEntries(Object.entries(state.editstatus).filter(
    ([key, value]) => (value != state.serverstatus[key]),
  ));
  return {
    ...state,
    editstatus,
  };
}

const EnableInputs = (state) => storeLocal({...state, disableInputs: false});
const DisableInputs = (state) => storeLocal({...state, disableInputs: true});
const ReloadWindow = (state) => [state, reloadWindow];

const ShowTab = (activeTab) => (state) => storeLocal({
  ...state,
  activeTab,
  firmwareImage: undefined,
  uploadProgress: undefined,
  uploadResult: undefined,
});

const RebootServer = (state, event) => ([
  DisableInputs(state),
  [fetchJson, ["api/server/reboot", GotServerStatus]],
]);

const UploadProgress = (state, event) => {
  const uploadProgress = {
    max: event.total,
    value: event.loaded,
  };
  return { ...state, uploadProgress };
};

const UploadFinished = (state, event) => {
  const query = event.target;
  const { status, statusText } = query;
  const response = JSON_safeParse(query.responseText);
  const uploadResult = { status, statusText, ...response };
  const success = uploadResult.status == 200 && uploadResult.code == 0;
  const reloadTime = success ? Date.now() + RELOAD_TIMEOUT : undefined;
  const effect = (
    success
    ? [timeout, [RELOAD_TIMEOUT, ReloadWindow]]
    : [timeout, [DISABLE_TIMEOUT, EnableInputs]]
  );
  return [
    { ...state, uploadResult, reloadTime },
    effect,
  ];
};

const SetSourceImageURL = (state, sourceImageURL) => storeLocal({
  ...state,
  sourceImageURL,
});

const SetSourceImageBitmap = (state, sourceImageBitmap) => updateImage({
  ...state,
  sourceImageBitmap,
});

const SetImageData = (state, {imageURL, imageBlob}) => storeLocal({
  ...state,
  imageURL,
  imageBlob,
});


// Preferences
const SetEditField = (state, key, value) => objStore(state, key.split("."), value);

const PrefsSave = (state, event) => ([
  DisableInputs(SetEditField(state, "editstatus.wifiPassword", undefined)),
  [postRequest, ["prefs", state.editstatus, GotServerStatus]],
]);

const PrefsRestore = (state) => storeLocal({...state, editstatus: {}});

const ResetSettings = (state) => updateImage(state, defaultSettings);

const UploadFirmware = (state) => ([
  DisableInputs(state),
  [uploadFile, ["update", state.firmwareImage, state.firmwareImage.name, UploadProgress, UploadFinished]],
]);

const UploadImage = (state) => ([
  DisableInputs(state),
  [uploadFile, ["api/image", state.imageBlob, state.sourceImageName, UploadProgress, UploadFinished]],
]);


const EditField = (key, parse) => (state, event) => storeLocal(SetEditField(state, key, parse(event.target.value)));

const EditText = (key) => EditField(key, (value) => value);

const EditFile = (key) => (state, event) => {
  return storeLocal({
    ...state,
    [key]: event.target.files.length == 1 && event.target.files[0],
  });
};


// Actions for image settings:

const EditImage = (key) => (state, event) => {
  const file = event.target.files.length == 1 && event.target.files[0];
  return [
    storeLocal({
      ...state,
      [key]: file,
      sourceImageName: file.name,
    }),
    [renderImageFromFile, [file]],
    [readDataURLFromFile, [file]],
  ];
};

const EditAspectRatio = (state, event) =>
  updateImage(state, {
      aspectPreset: "custom",
      aspectRatio: aspectToFactor(event.target.value),
  });

const EditImageSetting = (key) => (state, event) =>
  updateImage(state, {
      [key]: event.target.value,
  });


const StopDrag = (state, event) => ({...state, isDragging: false});
const StartDrag = (state, event) => ({
  ...state,
  isDragging: event.buttons == 1,
  dragMouseOffsetX: event.offsetX,
  dragMouseOffsetY: event.offsetY,
  dragImageOffsetX: state.imageSettings.xOffset,
  dragImageOffsetY: state.imageSettings.yOffset,
});

const DoDrag = (state, event) => {
  if (event.buttons != 1) {
    return {...state, isDragging: false};
  }

  const deltaX = (event.offsetX - state.dragMouseOffsetX) / event.target.width;
  const deltaY = (event.offsetY - state.dragMouseOffsetY) / event.target.height;

  const {displayWidth, displayHeight} = state.serverstatus;
  const displayAspect = displayWidth / displayHeight;

  const {imageSettings} = state;
  const {aspectRatio, imageRotation} = imageSettings;
  const zoom = zoomFactor(imageSettings.zoom);

  const sizeX = zoom * aspectRatio;
  const sizeY = zoom;

  const dx = deltaX * displayAspect;
  const dy = deltaY;
  const cos = Math.cos(-imageRotation * Math.PI / 180);
  const sin = Math.sin(-imageRotation * Math.PI / 180);

  const xOffset = state.dragImageOffsetX + (dx * cos - dy * sin) / sizeX;
  const yOffset = state.dragImageOffsetY + (dx * sin + dy * cos) / sizeY;

  return updateImage(state, {
      xOffset,
      yOffset,
  });
};

const DoZoom = (state, event) => {
  event.returnValue = false;

  const {deltaX, deltaY} = event;

  const {imageSettings} = state;
  let {aspectPreset, aspectRatio, zoom} = imageSettings;

  if (deltaX != 0) {
    aspectPreset = "custom";
    aspectRatio = aspectToFactor(aspectToValue(aspectRatio) + 5 * Math.sign(deltaX));
  }

  if (deltaY != 0) {
    zoom = zoom + Math.sign(-deltaY);
  }

  return updateImage(state, {
      aspectPreset,
      aspectRatio,
      zoom,
  });
};


// UI components

const Fieldset = (legend, fields) => (
  h("fieldset", {}, [
    h("legend", {}, text(legend)),
    h("dl", {}, fields.flat(1)),
  ])
);

const Field = (dt, props, dd) => ([
  h("dt", props, text(dt)),
  h("dd", props, dd),
]);

const HyperRef = (href, name) => (
  h("a", {href, target: "_blank"}, text(name))
);

const PrefsInput = (state, key, label, contentFunc) => {
  const default_ = state.serverstatus[key];
  const value = state.editstatus[key] ?? default_;
  const modified = value != default_;
  return Field(label, {class: {modified}}, contentFunc(`editstatus.${key}`, value));
};

const AppInput = (state, key, label, contentFunc) => {
  const value = objRetrieve(state, key.split("."));
  return Field(label, {}, contentFunc(key, value));
};

const TextInput = (props) => (key, value) => h("input", {
  type: "text",
  value,
  oninput: EditText(key),
  ...props,
});

const RadioList = (name, items, action, sep) => (key, value) => (
  items.flatMap((item, idx) => [
    h("input", {
      type: "radio",
      name,
      value: item.value,
      id: name + item.value,
      checked: value == item.value,
      oninput: action ?? EditText(key),
    }),
    h("label", {for: name + item.value}, text(item.label)),
    (idx == items.length - 1) || (sep ?? h("br", {}, [])),
  ])
);

const NavButton = (state, name, label) => {
  const disabled = state.disableInputs;
  const active = state.activeTab == name;
  return h("div", {
    onclick: !disabled && !active && ShowTab(name),
    class: { active, disabled },
  }, text(label));
};

if (initialState.sourceImageURL) {
  initialState.sourceImageBitmap = await createImageBitmapFromDataURL(initialState.sourceImageURL);
}

app({
  init: [
    UpdateUI(initialState),
    [fetchJson, ["api/status", GotServerStatus]],
  ],

  subscriptions: (state) => [
    [every, [1000, UpdateUI]],
  ],

  view: (state) => {
    const {serverstatus, activeTab, disableInputs, editstatus, imageSettings} = state;
    const isWiFiOff = (editstatus.wifiMode ?? serverstatus.wifiMode) == "OFF";
    const isDragging = state.isDragging;

    return h("div", {}, [
      h("h1", {}, text("NameTagOS")),

      h("nav", {}, [
        NavButton(state, "status", "Display"),
        NavButton(state, "prefs", "System"),
      ]),

      activeTab == "status" && h('main', {}, [
        Fieldset("Image", [
          AppInput(state, "imageFile", "Image file:", (key, value) => h("input", {
            type: "file",
            accept: "image/*",
            oninput: EditImage(key),
          })),

          state.imageURL &&
          AppInput(state, "imageSettings.canvasRotation", "Display format:", RadioList("canvasRotation", [
            {value: "0deg", label: "Landscape"},
            {value: "90deg", label: "Portrait"},
          ], EditImageSetting("canvasRotation"), h("span", {}))),

          state.imageURL &&
          Field("Image rotation:", {}, [
            h("input", {
              type: "range",
              min: 0,
              max: 360,
              step: 1,
              value: imageSettings.imageRotation,
              oninput: EditImageSetting("imageRotation"),
            }),
            h("br", {}),
            ...RadioList("imageRotation", [
              {value: 0, label: "0°"},
              {value: 90, label: "90°"},
              {value: 180, label: "180°"},
              {value: 270, label: "270°"},
            ], EditImageSetting("imageRotation"), h("span", {}))(
              "imageSettings.imageRotation", imageSettings.imageRotation),
          ]),

          state.imageURL &&
          AppInput(state, "imageSettings.palette", "Palette:", RadioList("palette", [
            {value: "display", label: "Display"},
            {value: "original", label: "Original"},
          ], EditImageSetting("palette"), h("span", {}))),

          state.imageURL &&
          AppInput(state, "imageSettings.backgroundColor", "Background color:", RadioList("backgroundColor", [
            {value: "white", label: "White"},
            {value: "red", label: "Red"},
            {value: "black", label: "Black"},
          ], EditImageSetting("backgroundColor"), h("span", {}))),

          state.imageURL &&
          Field("Color threshold:", {}, h("input", {
            type: "range",
            min: 0,
            max: 256,
            step: 1,
            value: imageSettings.colorThreshold,
            oninput: EditImageSetting("colorThreshold"),
          })),

          state.imageURL &&
          AppInput(state, "imageSettings.aspectPreset", "Aspect preset:", RadioList("aspectPreset", [
            {value: "picture", label: "Picture"},
            {value: "display", label: "Display"},
            {value: "custom", label: "User"},
          ], EditImageSetting("aspectPreset"), h("span", {}))),

          state.imageURL &&
          Field("Aspect ratio:", {}, h("input", {
            type: "range",
            min: 0,
            max: 1000,
            step: 1,
            value: aspectToValue(imageSettings.aspectRatio),
            oninput: EditAspectRatio,
          })),

          state.imageURL &&
          Field("Zoom:", {}, h("input", {
            type: "range",
            min: 0,
            max: 100,
            step: 1,
            value: imageSettings.zoom,
            oninput: EditImageSetting("zoom"),
          })),

        ]),

        (state.uploadProgress || state.uploadResult) &&
        Fieldset("Upload", [
          state.uploadProgress &&
          Field("Progress:", {}, [
            h("progress", state.uploadProgress),
          ]),

          state.uploadResult &&
          Field("Message:", {class: {
            success: state.uploadResult.status == 200 && state.uploadResult.code == 0,
            error: state.uploadResult.status != 200,
            failure: state.uploadResult.code > 0,
          }}, [
            text(state.uploadResult.message ?? state.uploadResult.statusText),
          ]),
        ]),

        h("div", {class: "actions"}, [
          h("button", {
            onclick: ResetSettings,
            disabled: disableInputs || !state.imageBlob,
          }, text("Reset settings")),

          h("button", {
            onclick: UploadImage,
            disabled: disableInputs || !state.imageBlob,
          }, text("Upload image")),
        ]),

        state.imageURL &&
        h("div", {
          class: "previewContainer",
          style: {
            height: (
              imageSettings.canvasRotation === "0deg"
              ? `${2 * serverstatus.displayHeight}px`
              : `${2 * serverstatus.displayWidth}px`
            ),
          },
        }, [
          h("img", {
            class: "preview",
            src: state.imageURL,
            width: 2 * serverstatus.displayWidth,
            height: 2 * serverstatus.displayHeight,
            style: {
              rotate: imageSettings.canvasRotation,
            },
            onmousedown: !isDragging && StartDrag,
            onmouseup: isDragging && StopDrag,
            onmousemove: isDragging && DoDrag,
            onwheel: DoZoom,
            draggable: false,
          }),
        ]),

      ]), // </main> "status"

      activeTab == "prefs" && h('main', {}, [
        Fieldset("Host device", [
          Field("System events:",      {}, HyperRef("file/events.log", "events.log")),
        ]),

        Fieldset("WiFi settings", [
          PrefsInput(state, "wifiMode", "Connection mode:", RadioList("wifiMode", [
            {value: "OFF", label: "Off"},
            {value: "STA", label: "Client"},
            {value: "AP", label: "Hotspot"},
          ])),
          PrefsInput(state, "wifiSsid", "SSID/name:", TextInput({disabled: isWiFiOff})),
          PrefsInput(state, "wifiPassword", "Password:", TextInput({disabled: isWiFiOff, placeholder: "**************"})),
          PrefsInput(state, "wifiHostname", "Device hostname:", TextInput({disabled: isWiFiOff})),
        ]),

        h("div", {class: "actions"}, [
          h("button", {onclick: PrefsSave, disabled: disableInputs}, text("Save")),
          h("button", {onclick: PrefsRestore, disabled: disableInputs}, text("Restore")),
        ]),

        Fieldset("Firmware", [
          PrefsInput(state, "firmwareImage", "Firmware image:", (key, value) => h("input", {
            type: "file",
            accept: ".bin,.bin.gz",
            oninput: EditFile(key),
          })),
        ]),

        (state.uploadProgress || state.uploadResult) &&
        Fieldset("Upload", [
          state.uploadProgress &&
          Field("Progress:", {}, [
            h("progress", state.uploadProgress),
          ]),

          state.uploadResult &&
          Field("Message:", {class: {
            success: state.uploadResult.status == 200 && state.uploadResult.code == 0,
            error: state.uploadResult.status != 200,
            failure: state.uploadResult.code > 0,
          }}, [
            text(state.uploadResult.message ?? state.uploadResult.statusText),
          ]),
        ]),

        h("div", {class: "actions"}, [

          !state.reloadTime &&
          h("button", {
            onclick: UploadFirmware,
            disabled: disableInputs || !state.firmwareImage,
          }, text("Upload firmware")),

          state.reloadTime &&
          h("button", {
            onclick: ReloadWindow,
          }, text(`Reload page (${Math.round((state.reloadTime - Date.now()) / 1000)}s)`)),
        ]),

      ]), // </main>

    ]); // outer div
  },

  node: document.getElementById("app"),
})

    </script>
  </body>
</html>
